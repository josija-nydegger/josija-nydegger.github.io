# Einstellungen für GitHub Pages (Jekyll)
title: Josija Nydegger
tagline: Bauingenieurwesen · BIM · Digital Construction
description: Persönliche Website von Josija Nydegger – Bauingenieurwesen an der BFH, Arbeiten, Projekte und Blog zu Tragwerken, BIM und Digital Construction.
url: https://josija-nydegger.github.io
lang: de
locale: de_CH
timezone: Europe/Zurich

# Bild für die Link-Vorschau (LinkedIn, WhatsApp usw.)
image: /images/og-image.jpg

# E-Mail-Adresse, Base64-kodiert, damit Bots sie im Quelltext nicht finden.
# Wird erst im Browser per JavaScript zusammengesetzt (siehe _layouts/default.html).
# Neue Adresse kodieren z. B. mit: printf 'neue@adresse.ch' | base64
email_b64: am9zaWphLm55ZGVnZ2VyQGdtYWlsLmNvbQ==

author:
  name: Josija Nydegger
  url: https://josija-nydegger.github.io

social:
  name: Josija Nydegger
  links:
    - https://www.linkedin.com/in/josija-nydegger
    - https://github.com/josija-nydegger
    - https://www.instagram.com/josija.nydegger
    - https://strava.app.link/8vhYUAcGq7b
    - https://orcid.org/0009-0005-4270-2574

# Von GitHub Pages unterstützte Plugins
# (RSS-Feeds sind eigene Vorlagen: /feed.xml und /en/feed.xml, siehe _includes/atom.xml)
plugins:
  - jekyll-seo-tag   # Titel, Beschreibung und Link-Vorschau (Open Graph)
  - jekyll-sitemap   # Sitemap unter /sitemap.xml

# Deutsche Blogbeiträge erscheinen unter /blog/titel-des-beitrags/,
# englische (Ordner _posts/en/) unter /en/blog/title-of-the-post/
permalink: /blog/:title/

# Standardwerte: alles ist Deutsch, ausser im Ordner en/ und _posts/en/.
# Alle Beiträge verwenden automatisch das Layout "post".
defaults:
  - scope:
      path: ""
    values:
      lang: de
      locale: de_CH
  - scope:
      path: "en"
    values:
      lang: en
      locale: en_US
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: "_posts/en"
      type: posts
    values:
      lang: en
      locale: en_US
      permalink: /en/blog/:title/

markdown: kramdown
kramdown:
  input: GFM

# Diese Dateien werden nicht veröffentlicht
exclude:
  - README.md
  - ANLEITUNG.md
  - CLAUDE.md
