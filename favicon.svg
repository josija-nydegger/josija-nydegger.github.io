<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Hintergrund -->
  <rect width="64" height="64" rx="14" fill="#1a1a1a"/>
  <!-- Isometrischer Würfel als Drahtmodell (Bauteil / BIM-Element) -->
  <g fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <path d="M32 12 L49 22 L49 42 L32 52 L15 42 L15 22 Z"/>
    <path d="M15 22 L32 32 L49 22"/>
    <path d="M32 32 L32 52"/>
  </g>
  <!-- Verdeckte Kanten gestrichelt, wie in einem CAD-Modell -->
