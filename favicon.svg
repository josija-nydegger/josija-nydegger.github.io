    <path d="M32 12 L32 32"/>
  </g>
  <!-- Knotenpunkte -->
  <circle cx="32" cy="32" r="4.5" fill="#f2a43a"/>
  <circle cx="15" cy="22" r="2.5" fill="#ffffff"/>
  <circle cx="49" cy="22" r="2.5" fill="#ffffff"/>
  <circle cx="32" cy="52" r="2.5" fill="#ffffff"/>
</svg>
